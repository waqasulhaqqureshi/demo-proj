<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Bridge</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e3e6eb;
      --text: #1a1d23;
      --muted: #667085;
      --accent: #2f6fed;
      --accent-text: #ffffff;
      --ok: #1a7f4b;
      --ok-bg: #e6f4ec;
      --bad: #b42318;
      --bad-bg: #fdecea;
      --warn: #a15c07;
      --warn-bg: #fdf3e2;
      --bubble-ai: #eef3fe;
      --bubble-caller: #f1f2f4;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --surface: #171a21;
        --border: #2a2f3a;
        --text: #e7e9ee;
        --muted: #98a1b2;
        --accent: #5b8cff;
        --accent-text: #0b0d12;
        --ok: #4cc38a;
        --ok-bg: #12291e;
        --bad: #ff7a6e;
        --bad-bg: #331512;
        --warn: #f0b35a;
        --warn-bg: #30230f;
        --bubble-ai: #1b2740;
        --bubble-caller: #22262f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      max-width: 1100px; margin: 0 auto; padding: 20px 16px 8px;
    }
    header h1 { font-size: 20px; margin: 0; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    main {
      max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px;
      display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      align-items: start;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px;
    }
    .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
    .wide { grid-column: 1 / -1; }
    .rows { display: grid; gap: 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 34px; }
    .row .label { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .row .value { color: var(--muted); font-size: 13px; text-align: right; overflow-wrap: anywhere; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); }
    .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
    .hint { font-size: 12.5px; color: var(--muted); margin: 2px 0 0 17px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input, select {
      width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font: inherit;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 14px; cursor: pointer;
      border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
    }
    button.secondary { background: transparent; color: var(--accent); }
    button.small { padding: 5px 10px; font-size: 13px; }
    button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .segmented { display: flex; gap: 6px; }
    .segmented label {
      flex: 1; margin: 0; padding: 8px; text-align: center; border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer; color: var(--text);
    }
    .segmented input { display: none; }
    .segmented input:checked + span { color: var(--accent); font-weight: 600; }
    .segmented label:has(input:checked) { border-color: var(--accent); }
    .msg { font-size: 13px; margin-top: 10px; padding: 8px 10px; border-radius: 8px; display: none; }
    .msg.show { display: block; }
    .msg.ok { background: var(--ok-bg); color: var(--ok); }
    .msg.bad { background: var(--bad-bg); color: var(--bad); }
    .list { display: grid; gap: 6px; }
    .num {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-variant-numeric: tabular-nums;
    }
    .badge { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: var(--ok-bg); color: var(--ok); }
    .badge.owned { background: var(--bubble-ai); color: var(--accent); }
    .empty { color: var(--muted); font-size: 13px; }
    .timeline { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .step {
      font-size: 12.5px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted);
    }
    .step.done { color: var(--ok); border-color: var(--ok); }
    .step.current { color: var(--accent-text); background: var(--accent); border-color: var(--accent); }
    .step.failed { color: #fff; background: var(--bad); border-color: var(--bad); }
    .call-meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; overflow-wrap: anywhere; }
    .transcript {
      display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto;
      padding: 4px 2px;
    }
    .bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bubble.ai { background: var(--bubble-ai); align-self: flex-start; }
    .bubble.caller { background: var(--bubble-caller); align-self: flex-end; }
    .bubble .who { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .system-note { align-self: center; font-size: 12px; color: var(--muted); }
    #login {
      position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 16px;
    }
    #login.show { display: flex; }
    #login .card { width: 100%; max-width: 380px; }
    code { font-size: 12.5px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="login">
    <form class="card" id="login-form">
      <h2>Voice Bridge</h2>
      <p class="empty" style="margin:0">Enter the <code>ADMIN_TOKEN</code> from the server's environment (Render → Environment, or <code>telnyx-bridge/.env</code> locally).</p>
      <label for="token">Admin token</label>
      <input id="token" type="password" autocomplete="current-password" required>
      <div class="actions"><button type="submit">Sign in</button></div>
      <div class="msg bad" id="login-msg"></div>
    </form>
  </div>

  <header>
    <div>
      <h1>Voice Bridge</h1>
      <p>Telnyx calls answered by Gemini Live</p>
    </div>
    <button class="secondary small" id="logout">Sign out</button>
  </header>

  <main>
    <section class="card">
      <h2>Setup <button class="secondary small" id="refresh-status">Refresh</button></h2>
      <div class="rows" id="status-rows"><div class="empty">Loading…</div></div>
      <div class="msg" id="setup-msg"></div>
    </section>

    <section class="card">
      <h2>Caller IDs <button class="secondary small" id="refresh-ids">Refresh</button></h2>
      <div class="list" id="caller-ids"><div class="empty">Loading…</div></div>

      <form id="verify-form">
        <label for="verify-number">Verify a new number</label>
        <input id="verify-number" placeholder="+923001234567" inputmode="tel" required>
        <label>Send the code by</label>
        <div class="segmented">
          <label><input type="radio" name="method" value="sms" checked><span>SMS</span></label>
          <label><input type="radio" name="method" value="call"><span>Voice call</span></label>
        </div>
        <div class="actions"><button type="submit" id="send-code">Send code</button></div>
      </form>

      <form id="confirm-form" hidden>
        <label for="verify-code">Code sent to <span id="confirm-number"></span></label>
        <input id="verify-code" inputmode="numeric" autocomplete="one-time-code" required>
        <div class="actions">
          <button type="submit">Verify</button>
          <button type="button" class="secondary" id="cancel-verify">Cancel</button>
        </div>
      </form>
      <div class="msg" id="verify-msg"></div>
    </section>

    <section class="card">
      <h2>Place a call</h2>
      <form id="call-form">
        <label for="from">From (caller ID)</label>
        <select id="from" required></select>
        <label for="to">To</label>
        <input id="to" placeholder="+923001234567" inputmode="tel" required>
        <div class="actions">
          <button type="submit" id="call-btn">Call</button>
          <button type="button" class="danger" id="hangup-btn" hidden>Hang up</button>
        </div>
      </form>
      <div class="msg" id="call-msg"></div>
    </section>

    <section class="card wide">
      <h2>Live call</h2>
      <div class="timeline" id="timeline"></div>
      <div class="call-meta" id="call-meta">No call yet.</div>
      <div class="transcript" id="transcript"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
